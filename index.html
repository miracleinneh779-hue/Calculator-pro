<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator Pro</title>
  <style>
    /* System fonts for portability - no external dependencies */
    @font-face {
      font-family: 'System Inter';
      font-style: normal;
      font-weight: 400;
      src: local('Segoe UI'), local('Roboto'), local('Helvetica Neue'), local('Arial'), local('sans-serif');
    }
    @font-face {
      font-family: 'System Mono';
      font-style: normal;
      font-weight: 400;
      src: local('SF Mono'), local('Consolas'), local('Monaco'), local('monospace');
    }
  </style>
  <style>
    :root {
      --bg: #0b0e14;
      --bg-2: #10131c;
      --card: rgba(23, 26, 36, 0.72);
      --card-solid: #171a24;
      --text: #eef1f7;
      --text-dim: #9aa1b1;
      --muted: #6b7280;
      --border: rgba(255, 255, 255, 0.08);
      --num-bg: rgba(255, 255, 255, 0.055);
      --num-bg-hover: rgba(255, 255, 255, 0.13);
      --func-bg: rgba(255, 255, 255, 0.035);
      --func-bg-hover: rgba(255, 255, 255, 0.10);
      --func-text: #cbd2e0;
      --op-bg: rgba(56, 189, 248, 0.14);
      --op-bg-hover: rgba(56, 189, 248, 0.26);
      --op-text: #7dd3fc;
      --danger-bg: rgba(248, 113, 113, 0.12);
      --danger-bg-hover: rgba(248, 113, 113, 0.22);
      --danger-text: #fca5a5;
      --accent-1: #22d3ee;
      --accent-2: #a78bfa;
      --accent-3: #f472b6;
      --equals-text: #0b0e14;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      --key-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    [data-theme="light"] {
      --bg: #eef1f7;
      --bg-2: #e6eaf2;
      --card: rgba(255, 255, 255, 0.78);
      --card-solid: #ffffff;
      --text: #1f2430;
      --text-dim: #5b6472;
      --muted: #9aa3b2;
      --border: rgba(15, 23, 42, 0.08);
      --num-bg: rgba(15, 23, 42, 0.045);
      --num-bg-hover: rgba(15, 23, 42, 0.10);
      --func-bg: rgba(15, 23, 42, 0.03);
      --func-bg-hover: rgba(15, 23, 42, 0.08);
      --func-text: #4b5563;
      --op-bg: rgba(2, 132, 199, 0.12);
      --op-bg-hover: rgba(2, 132, 199, 0.22);
      --op-text: #0369a1;
      --danger-bg: rgba(220, 38, 38, 0.10);
      --danger-bg-hover: rgba(220, 38, 38, 0.18);
      --danger-text: #b91c1c;
      --equals-text: #ffffff;
      --shadow: 0 24px 60px rgba(30, 41, 59, 0.22);
      --key-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 12px;
      transition: background 0.35s ease, color 0.35s ease;
    }

    /* Decorative background */
    .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
    .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55; transition: opacity 0.35s ease; }
    .blob-1 { width: 420px; height: 420px; background: radial-gradient(circle, var(--accent-1), transparent 70%); top: -120px; left: -100px; animation: float1 18s ease-in-out infinite; }
    .blob-2 { width: 380px; height: 380px; background: radial-gradient(circle, var(--accent-2), transparent 70%); bottom: -120px; right: -90px; animation: float2 22s ease-in-out infinite; }
    .blob-3 { width: 300px; height: 300px; background: radial-gradient(circle, var(--accent-3), transparent 70%); bottom: 20%; left: 55%; animation: float1 26s ease-in-out infinite; }
    [data-theme="light"] .blob { opacity: 0.35; }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, 35px) scale(1.12); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-45px, -30px) scale(1.1); }
    }

    .calculator {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 20px;
      animation: pop-in 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }
    @keyframes pop-in {
      from { opacity: 0; transform: translateY(16px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 0 4px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 30px; height: 30px; border-radius: 9px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: var(--equals-text);
      font-weight: 700; font-size: 15px;
      box-shadow: 0 4px 14px rgba(34, 211, 238, 0.35);
    }
    .title { font-size: 15px; font-weight: 600; letter-spacing: 0.2px; }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 34px; height: 34px; border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--func-bg);
      color: var(--text-dim);
      display: grid; place-items: center;
      cursor: pointer; transition: 0.18s ease;
    }
    .icon-btn:hover { background: var(--func-bg-hover); color: var(--text); }
    .icon-btn svg { width: 17px; height: 17px; }
    #theme-toggle .icon-sun { display: none; }
    #theme-toggle .icon-moon { display: block; }
    [data-theme="light"] #theme-toggle .icon-sun { display: block; }
    [data-theme="light"] #theme-toggle .icon-moon { display: none; }

    /* Display */
    .display {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 16px;
      margin-bottom: 16px;
      text-align: right;
      overflow: hidden;
      transition: background 0.35s ease;
    }
    .expression-line {
      font-family: 'SF Mono', 'Consolas', 'Monaco', 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--text-dim);
      min-height: 20px;
      white-space: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      direction: rtl;
      text-align: left;
    }
    .expression-line::-webkit-scrollbar { display: none; }
    .result-line {
      font-family: 'SF Mono', 'Consolas', 'Monaco', 'JetBrains Mono', monospace;
      font-size: clamp(40px, 13vw, 54px);
      font-weight: 500;
      line-height: 1.1;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      overflow: hidden;
      white-space: nowrap;
      transition: color 0.2s ease;
    }
    .result-line.error { color: var(--danger-text); animation: shake 0.3s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-3px); }
    }

    /* Keypads */
    .sci-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .main-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .key {
      border: none;
      border-radius: 16px;
      font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', system-ui, sans-serif;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      transition: transform 0.08s ease, background 0.18s ease, color 0.18s ease;
      box-shadow: var(--key-shadow);
      position: relative;
      overflow: hidden;
    }
    .key:active { transform: scale(0.92); }
    .key:focus-visible { outline: 2px solid var(--accent-1); outline-offset: 2px; }

    .sci-grid .key {
      min-height: 46px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 13px;
    }

    .key.num { background: var(--num-bg); color: var(--text); font-size: 20px; font-weight: 600; }
    .key.num:hover { background: var(--num-bg-hover); }

    .key.func { background: var(--func-bg); color: var(--func-text); }
    .key.func:hover { background: var(--func-bg-hover); color: var(--text); }

    .key.op { background: var(--op-bg); color: var(--op-text); font-size: 22px; font-weight: 600; }
    .key.op:hover { background: var(--op-bg-hover); }

    .key.danger { background: var(--danger-bg); color: var(--danger-text); }
    .key.danger:hover { background: var(--danger-bg-hover); }

    .key.mode { background: var(--func-bg); color: var(--accent-1); font-weight: 700; }
    .key.mode:hover { background: var(--func-bg-hover); }

    .key.equals {
      grid-row: span 3;
      background: linear-gradient(160deg, var(--accent-1), var(--accent-2));
      color: var(--equals-text);
      font-size: 26px;
      font-weight: 700;
      min-height: 0;
    }
    .key.equals:hover { filter: brightness(1.08); }
    .key.equals:active { transform: scale(0.96); }

    .key.zero { grid-column: span 2; }

    /* History panel */
    .history-backdrop {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 90;
    }
    .history-backdrop.open { opacity: 1; pointer-events: auto; }

    .history-panel {
      position: fixed;
      top: 0; right: 0;
      height: 100vh;
      width: min(360px, 90vw);
      background: var(--card-solid);
      backdrop-filter: blur(24px);
      border-left: 1px solid var(--border);
      box-shadow: -20px 0 60px rgba(0, 0, 0, 0.35);
      padding: 22px;
      transform: translateX(105%);
      transition: transform 0.32s cubic-bezier(0.3, 0.9, 0.3, 1);
      z-index: 100;
      display: flex;
      flex-direction: column;
      color: var(--text);
    }
    .history-panel.open { transform: translateX(0); }

    .history-header {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 16px; border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .history-title { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .history-actions { display: flex; gap: 8px; }
    .history-clear {
      background: none; border: none; color: var(--muted);
      font-size: 13px; cursor: pointer; padding: 4px 6px; border-radius: 8px;
    }
    .history-clear:hover { color: var(--danger-text); background: var(--danger-bg); }
    .close-history {
      background: none; border: none; color: var(--muted);
      font-size: 22px; cursor: pointer; line-height: 1;
      width: 32px; height: 32px; border-radius: 8px;
    }
    .close-history:hover { color: var(--text); background: var(--func-bg); }

    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .history-empty { color: var(--muted); font-style: italic; padding: 20px 0; text-align: center; }

    .history-item {
      padding: 12px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .history-item:hover { background: var(--func-bg); }
    .history-item .h-expr {
      font-family: 'SF Mono', 'Consolas', 'Monaco', 'JetBrains Mono', monospace;
      font-size: 13px; color: var(--text-dim);
      word-break: break-all;
    }
    .history-item .h-result {
      font-family: 'SF Mono', 'Consolas', 'Monaco', 'JetBrains Mono', monospace;
      font-size: 18px; font-weight: 600; color: var(--accent-1);
      margin-top: 4px;
    }

    @media (max-width: 420px) {
      .calculator { padding: 16px; border-radius: 24px; }
      .key { min-height: 52px; }
      .sci-grid .key { min-height: 42px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="calculator" id="calculator">
    <header class="app-header">
      <div class="brand">
        <span class="logo">ƒ</span>
        <span class="title">Calculator Pro</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="history-toggle" aria-label="Calculation history" title="History">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
        </button>
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </header>

    <div class="display">
      <div class="expression-line" id="expression" aria-live="polite">&nbsp;</div>
      <div class="result-line" id="result">0</div>
    </div>

    <!-- Scientific functions -->
    <div class="sci-grid">
      <button class="key func" data-func="sin" title="Sine">sin</button>
      <button class="key func" data-func="cos" title="Cosine">cos</button>
      <button class="key func" data-func="tan" title="Tangent">tan</button>
      <button class="key func" data-func="sqrt" title="Square root">√</button>
      <button class="key func" data-func="square" title="Square">x²</button>

      <button class="key func" data-func="ln" title="Natural logarithm">ln</button>
      <button class="key func" data-func="log" title="Base-10 logarithm">log</button>
      <button class="key func" data-func="power" title="Power">xʸ</button>
      <button class="key func" data-func="pi" title="Pi">π</button>
      <button class="key func" data-func="e" title="Euler's number">e</button>

      <button class="key func" data-func="lparen" title="Open parenthesis">(</button>
      <button class="key func" data-func="rparen" title="Close parenthesis">)</button>
      <button class="key func" data-func="percent" title="Percent">%</button>
      <button class="key mode" id="deg-toggle" title="Degrees / Radians">DEG</button>
      <button class="key danger" id="backspace" title="Backspace">⌫</button>
    </div>

    <!-- Main keypad -->
    <div class="main-grid">
      <button class="key danger" id="ac" title="Clear all">AC</button>
      <button class="key op" data-op="÷" title="Divide">÷</button>
      <button class="key op" data-op="×" title="Multiply">×</button>
      <button class="key op" data-op="−" title="Subtract">−</button>

      <button class="key num" data-digit="7">7</button>
      <button class="key num" data-digit="8">8</button>
      <button class="key num" data-digit="9">9</button>
      <button class="key op" data-op="+" title="Add">+</button>

      <button class="key num" data-digit="4">4</button>
      <button class="key num" data-digit="5">5</button>
      <button class="key num" data-digit="6">6</button>
      <button class="key equals" id="equals" title="Equals">=</button>

      <button class="key num" data-digit="1">1</button>
      <button class="key num" data-digit="2">2</button>
      <button class="key num" data-digit="3">3</button>

      <button class="key num zero" data-digit="0">0</button>
      <button class="key num" data-digit="." title="Decimal point">.</button>
    </div>
  </main>

  <!-- History panel -->
  <div class="history-backdrop" id="history-backdrop"></div>
  <aside class="history-panel" id="history-panel" aria-label="Calculation history">
    <div class="history-header">
      <span class="history-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
        History
      </span>
      <div class="history-actions">
        <button class="history-clear" id="history-clear">Clear</button>
        <button class="close-history" id="close-history" aria-label="Close history">×</button>
      </div>
    </div>
    <div class="history-list" id="history-list"></div>
  </aside>

  <script>
    /* ================= ENGINE START ================= */
    // Pure math engine: tokenizer + recursive-descent parser (no eval).

    function tokenize(str) {
      const tokens = [];
      const n = str.length;
      let i = 0;
      const isDigit = c => c >= '0' && c <= '9';

      while (i < n) {
        const c = str[i];
        if (c === ' ' || c === '\t' || c === '\u00A0') { i++; continue; }

        // Numbers (with optional scientific notation)
        if (isDigit(c) || (c === '.' && i + 1 < n && isDigit(str[i + 1]))) {
          let j = i, seenDot = false;
          while (j < n) {
            const d = str[j];
            if (isDigit(d)) { j++; continue; }
            if (d === '.' && !seenDot) { seenDot = true; j++; continue; }
            break;
          }
          if (j < n && (str[j] === 'e' || str[j] === 'E')) {
            let k = j + 1;
            if (k < n && (str[k] === '+' || str[k] === '-')) k++;
            if (k < n && isDigit(str[k])) {
              j = k;
              while (j < n && isDigit(str[j])) j++;
            }
          }
          tokens.push({ type: 'num', value: parseFloat(str.slice(i, j)) });
          i = j;
          continue;
        }

        if (c === '+') { tokens.push({ type: 'op', value: '+' }); i++; continue; }
        if (c === '−' || c === '-') { tokens.push({ type: 'op', value: '-' }); i++; continue; }
        if (c === '×' || c === '*') { tokens.push({ type: 'op', value: '*' }); i++; continue; }
        if (c === '÷' || c === '/') { tokens.push({ type: 'op', value: '/' }); i++; continue; }
        if (c === '^') { tokens.push({ type: 'op', value: '^' }); i++; continue; }
        if (c === '%') { tokens.push({ type: 'op', value: '%' }); i++; continue; }
        if (c === '²') { tokens.push({ type: 'op', value: '²' }); i++; continue; }
        if (c === '(') { tokens.push({ type: 'lparen' }); i++; continue; }
        if (c === ')') { tokens.push({ type: 'rparen' }); i++; continue; }
        if (c === 'π' || c === 'Π') { tokens.push({ type: 'const', value: 'pi' }); i++; continue; }
        if (c === '√') { tokens.push({ type: 'func', value: 'sqrt' }); i++; continue; }

        if (/[a-zA-Z]/.test(c)) {
          let j = i;
          while (j < n && /[a-zA-Z]/.test(str[j])) j++;
          const word = str.slice(i, j).toLowerCase();
          if (word === 'e') tokens.push({ type: 'const', value: 'e' });
          else if (word === 'pi') tokens.push({ type: 'const', value: 'pi' });
          else if (['sin', 'cos', 'tan', 'log', 'ln', 'sqrt'].includes(word)) tokens.push({ type: 'func', value: word });
          else throw new Error('Unknown symbol: ' + word);
          i = j;
          continue;
        }

        throw new Error('Unexpected character: ' + c);
      }
      return tokens;
    }

    function evaluate(expression, options) {
      const degree = !options || options.degreeMode !== false;
      const tokens = tokenize(expression);
      if (tokens.length === 0) throw new Error('Empty expression');
      let pos = 0;
      const peek = () => tokens[pos];
      const next = () => tokens[pos++];

      const startsPrimary = t => t && (t.type === 'num' || t.type === 'const' || t.type === 'func' || t.type === 'lparen');

      function applyFunction(name, x) {
        switch (name) {
          case 'sin': return Math.sin(degree ? x * Math.PI / 180 : x);
          case 'cos': return Math.cos(degree ? x * Math.PI / 180 : x);
          case 'tan': return Math.tan(degree ? x * Math.PI / 180 : x);
          case 'log': if (x <= 0) throw new Error('Invalid input for log'); return Math.log10(x);
          case 'ln': if (x <= 0) throw new Error('Invalid input for ln'); return Math.log(x);
          case 'sqrt': if (x < 0) throw new Error('Invalid input for sqrt'); return Math.sqrt(x);
          default: throw new Error('Unknown function');
        }
      }

      function parseExpression() {
        let left = parseTerm();
        while (pos < tokens.length) {
          const t = peek();
          if (t.type === 'op' && (t.value === '+' || t.value === '-')) {
            next();
            const right = parseTerm();
            left = t.value === '+' ? left + right : left - right;
          } else break;
        }
        return left;
      }

      function parseTerm() {
        let left = parseUnary();
        while (pos < tokens.length) {
          const t = peek();
          if (t.type === 'op' && (t.value === '*' || t.value === '/')) {
            next();
            const right = parseUnary();
            if (t.value === '/') {
              if (right === 0) throw new Error('Cannot divide by zero');
              left = left / right;
            } else left = left * right;
          } else if (startsPrimary(t)) {
            const right = parseUnary(); // implicit multiplication
            left = left * right;
          } else break;
        }
        return left;
      }

      function parseUnary() {
        const t = peek();
        if (t && t.type === 'op' && (t.value === '+' || t.value === '-')) {
          next();
          const v = parseUnary();
          return t.value === '-' ? -v : v;
        }
        return parsePower();
      }

      function parsePower() {
        const base = parsePostfix();
        const t = peek();
        if (t && t.type === 'op' && t.value === '^') {
          next();
          const exp = parseUnary(); // right-associative
          return Math.pow(base, exp);
        }
        return base;
      }

      function parsePostfix() {
        let v = parsePrimary();
        while (pos < tokens.length) {
          const t = peek();
          if (t.type === 'op' && (t.value === '%' || t.value === '²')) {
            next();
            v = t.value === '%' ? v / 100 : v * v;
          } else break;
        }
        return v;
      }

      function parsePrimary() {
        const t = peek();
        if (!t) throw new Error('Unexpected end of expression');
        if (t.type === 'num') { next(); return t.value; }
        if (t.type === 'const') { next(); return t.value === 'pi' ? Math.PI : Math.E; }
        if (t.type === 'func') {
          next();
          let arg;
          if (peek() && peek().type === 'lparen') {
            next();
            arg = parseExpression();
            if (!peek() || peek().type !== 'rparen') throw new Error('Expected )');
            next();
          } else {
            // prefix form without parentheses, e.g. "√81" or "sin 30"
            arg = parseUnary();
          }
          return applyFunction(t.value, arg);
        }
        if (t.type === 'lparen') {
          next();
          const v = parseExpression();
          if (!peek() || peek().type !== 'rparen') throw new Error('Expected )');
          next();
          return v;
        }
        throw new Error('Unexpected token');
      }

      const value = parseExpression();
      if (pos < tokens.length) throw new Error('Unexpected token');
      return value;
    }

    function formatNumber(n) {
      if (typeof n !== 'number' || Number.isNaN(n) || !Number.isFinite(n)) return 'Error';
      if (n === 0) return '0';
      const abs = Math.abs(n);
      if (abs >= 1e12 || abs < 1e-9) {
        const parts = n.toExponential(8).split('e');
        let mant = parts[0];
        if (mant.includes('.')) mant = mant.replace(/0+$/, '').replace(/\.$/, '');
        return mant + 'e' + parts[1];
      }
      let s = String(Math.round(n * 1e12) / 1e12);
      if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
      if (s === '' || s === '-' || s === '-0') s = '0';
      return s;
    }

    function autoClose(expr) {
      let open = 0;
      for (const c of expr) {
        if (c === '(') open++;
        else if (c === ')') open = Math.max(0, open - 1);
      }
      return expr + ')'.repeat(open);
    }
    /* ================= ENGINE END ================= */


    /* ================= APP START ================= */
    const store = {
      get(key, fallback) {
        try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
        catch (e) { return fallback; }
      },
      set(key, val) {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
      },
      remove(key) {
        try { localStorage.removeItem(key); } catch (e) {}
      }
    };

    // DOM
    const expressionEl = document.getElementById('expression');
    const resultEl = document.getElementById('result');
    const calculatorEl = document.getElementById('calculator');
    const degToggle = document.getElementById('deg-toggle');
    const acBtn = document.getElementById('ac');
    const backspaceBtn = document.getElementById('backspace');
    const equalsBtn = document.getElementById('equals');
    const themeToggle = document.getElementById('theme-toggle');
    const historyToggle = document.getElementById('history-toggle');
    const historyPanel = document.getElementById('history-panel');
    const historyBackdrop = document.getElementById('history-backdrop');
    const historyList = document.getElementById('history-list');
    const historyClear = document.getElementById('history-clear');
    const closeHistory = document.getElementById('close-history');

    // State
    let expression = '';
    let justEvaluated = false;
    let committedResult = '';
    let degreeMode = store.get('calcpro.degree', true);
    let history = store.get('calcpro.history', []);

    function update() {
      // expression line (RTL keeps the newest part visible)
      expressionEl.textContent = expression || '\u00A0';

      if (justEvaluated) {
        resultEl.textContent = committedResult;
        resultEl.classList.toggle('error', committedResult === 'Error');
        return;
      }

      if (expression === '') {
        resultEl.textContent = '0';
        resultEl.classList.remove('error');
        return;
      }

      try {
        const value = evaluate(autoClose(expression), { degreeMode });
        resultEl.textContent = formatNumber(value);
        resultEl.classList.remove('error');
      } catch (err) {
        resultEl.textContent = '';
        resultEl.classList.remove('error');
      }
    }

    function pressDigit(d) {
      if (justEvaluated) { expression = ''; committedResult = ''; justEvaluated = false; }
      if (d === '.') {
        const m = expression.match(/(\d+\.?\d*)$/);
        if (m && m[1].includes('.')) { update(); return; }
        if (expression === '' || /[+−×÷^(]$/.test(expression)) expression += '0.';
        else expression += '.';
      } else {
        expression += d;
      }
      update();
    }

    function pressOperator(op) {
      if (justEvaluated) {
        expression = (committedResult && committedResult !== 'Error') ? committedResult : '';
        committedResult = '';
        justEvaluated = false;
      }
      const OPS = ['+', '−', '×', '÷', '^'];
      const e = expression;
      if (e === '') {
        if (op === '−' || op === '+') expression = op;
        update();
        return;
      }
      const last = e[e.length - 1];
      const prev = e.length >= 2 ? e[e.length - 2] : '';

      if (last === '−') {
        if (prev === '' || OPS.includes(prev)) {
          // trailing unary minus, e.g. "2^−" or lone "−"
          if (op === '−') { /* keep */ }
          else if (op === '+') expression = e.slice(0, -1);
          else if (prev === '') expression = (op === '+' || op === '−') ? op : '';
          else expression = e.slice(0, -2) + op;
        } else {
          // binary minus, e.g. "5−"
          if (op === '−') expression = e.slice(0, -1) + '+';
          else expression = e.slice(0, -1) + op;
        }
      } else if (OPS.includes(last)) {
        if (op === '−') expression = e + '−';
        else expression = e.slice(0, -1) + op;
      } else {
        expression = e + op;
      }
      update();
    }

    function pressEquals() {
      if (expression === '') return;
      const prepared = autoClose(expression);
      try {
        const value = evaluate(prepared, { degreeMode });
        const formatted = formatNumber(value);
        if (formatted === 'Error') { showError(); return; }
        expression = prepared;
        committedResult = formatted;
        justEvaluated = true;
        addToHistory(prepared, formatted);
        update();
      } catch (err) {
        showError();
      }
    }

    function showError() {
      justEvaluated = true;
      committedResult = 'Error';
      expressionEl.textContent = expression || '\u00A0';
      resultEl.textContent = 'Error';
      resultEl.classList.add('error');
    }

    function pressFunction(name) {
      if (justEvaluated) { expression = ''; committedResult = ''; justEvaluated = false; }
      expression += name === 'sqrt' ? '√(' : name + '(';
      update();
    }

    function pressConstant(c) {
      if (justEvaluated) { expression = ''; committedResult = ''; justEvaluated = false; }
      expression += c;
      update();
    }

    function pressParen(p) {
      if (justEvaluated) { expression = ''; committedResult = ''; justEvaluated = false; }
      expression += p;
      update();
    }

    function pressSquare() {
      if (justEvaluated) {
        expression = (committedResult && committedResult !== 'Error') ? committedResult : '';
        committedResult = ''; justEvaluated = false;
      }
      expression += '²';
      update();
    }

    function pressPercent() {
      if (justEvaluated) {
        expression = (committedResult && committedResult !== 'Error') ? committedResult : '';
        committedResult = ''; justEvaluated = false;
      }
      if (expression === '') { update(); return; }
      
      // Smart percentage calculation for standard calculator behavior
      // Pattern: [number] [op] [number] % 
      // Result: [number] [op] ([number] * [previous_number] / 100)
      const match = expression.match(/^(-?\d+\.?\d*)([+\-×÷])(-?\d+\.?\d*)$/);
      if (match) {
        const [, left, op, right] = match;
        const leftNum = parseFloat(left);
        const rightNum = parseFloat(right);
        let result;
        switch (op) {
          case '+':
          case '-':
            result = op === '+' ? leftNum + (leftNum * rightNum / 100) : leftNum - (leftNum * rightNum / 100);
            break;
          case '×':
            result = leftNum * rightNum / 100;
            break;
          case '÷':
            if (rightNum === 0) { showError(); return; }
            result = leftNum / (rightNum / 100);
            break;
          default:
            result = rightNum / 100;
        }
        expression = formatNumber(result);
        update();
        return;
      }
      
      // Simple percentage: just divide by 100
      const simpleMatch = expression.match(/(-?\d+\.?\d*)$/);
      if (simpleMatch) {
        const num = parseFloat(simpleMatch[1]);
        expression = expression.slice(0, -simpleMatch[1].length) + formatNumber(num / 100);
        update();
        return;
      }
      
      expression += '%';
      update();
    }

    function pressBackspace() {
      if (justEvaluated) justEvaluated = false;
      if (expression.length > 0) expression = expression.slice(0, -1);
      update();
    }

    function pressClear() {
      expression = '';
      justEvaluated = false;
      committedResult = '';
      resultEl.classList.remove('error');
      update();
    }

    function handleFunc(f) {
      switch (f) {
        case 'sin': case 'cos': case 'tan': case 'log': case 'ln':
          pressFunction(f); break;
        case 'sqrt': pressFunction('sqrt'); break;
        case 'square': pressSquare(); break;
        case 'power': pressOperator('^'); break;
        case 'pi': pressConstant('π'); break;
        case 'e': pressConstant('e'); break;
        case 'lparen': pressParen('('); break;
        case 'rparen': pressParen(')'); break;
        case 'percent': pressPercent(); break;
      }
    }

    function toggleDegreeMode() {
      degreeMode = !degreeMode;
      store.set('calcpro.degree', degreeMode);
      degToggle.textContent = degreeMode ? 'DEG' : 'RAD';
      update();
    }

    // History
    function addToHistory(expr, result) {
      history.unshift({ expression: expr, result });
      if (history.length > 50) history = history.slice(0, 50);
      store.set('calcpro.history', history);
      renderHistory();
    }

    function renderHistory() {
      if (!history.length) {
        historyList.innerHTML = '<p class="history-empty">No calculations yet</p>';
        return;
      }
      historyList.innerHTML = history.map((item, i) =>
        `<div class="history-item" data-index="${i}">
           <div class="h-expr">${escapeHtml(item.expression)} =</div>
           <div class="h-result">${escapeHtml(item.result)}</div>
         </div>`
      ).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function clearHistory() {
      history = [];
      store.remove('calcpro.history');
      renderHistory();
    }

    function openHistory(open) {
      historyPanel.classList.toggle('open', open);
      historyBackdrop.classList.toggle('open', open);
    }

    // Theme
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      store.set('calcpro.theme', theme);
    }

    // Keyboard
    function handleKeyboard(e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const k = e.key;
      if (/^[0-9]$/.test(k)) { e.preventDefault(); pressDigit(k); }
      else if (k === '.') { e.preventDefault(); pressDigit('.'); }
      else if (k === '+') { e.preventDefault(); pressOperator('+'); }
      else if (k === '-' || k === '−') { e.preventDefault(); pressOperator('−'); }
      else if (k === '*') { e.preventDefault(); pressOperator('×'); }
      else if (k === '/') { e.preventDefault(); pressOperator('÷'); }
      else if (k === '^') { e.preventDefault(); pressOperator('^'); }
      else if (k === '%') { e.preventDefault(); pressPercent(); }
      else if (k === 'Enter' || k === '=') { e.preventDefault(); pressEquals(); }
      else if (k === 'Backspace') { e.preventDefault(); pressBackspace(); }
      else if (k === 'Escape' || k === 'Delete') { e.preventDefault(); pressClear(); }
      else if (k === '(') { e.preventDefault(); pressParen('('); }
      else if (k === ')') { e.preventDefault(); pressParen(')'); }
      else if (k === 's') pressFunction('sin');
      else if (k === 'c') pressFunction('cos');
      else if (k === 't') pressFunction('tan');
      else if (k === 'l') pressFunction('log');
      else if (k === 'n') pressFunction('ln');
      else if (k === 'r') pressFunction('sqrt');
      else if (k === 'q') pressSquare();
      else if (k === 'p') pressOperator('^');
      else if (k === 'd') toggleDegreeMode();
    }

    // Wire up events
    function init() {
      document.querySelectorAll('[data-digit]').forEach(b =>
        b.addEventListener('click', () => pressDigit(b.dataset.digit)));
      document.querySelectorAll('[data-op]').forEach(b =>
        b.addEventListener('click', () => pressOperator(b.dataset.op)));
      document.querySelectorAll('[data-func]').forEach(b =>
        b.addEventListener('click', () => handleFunc(b.dataset.func)));

      acBtn.addEventListener('click', pressClear);
      backspaceBtn.addEventListener('click', pressBackspace);
      equalsBtn.addEventListener('click', pressEquals);
      degToggle.addEventListener('click', toggleDegreeMode);
      themeToggle.addEventListener('click', () => {
        const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        applyTheme(next);
      });
      historyToggle.addEventListener('click', () => openHistory(true));
      closeHistory.addEventListener('click', () => openHistory(false));
      historyBackdrop.addEventListener('click', () => openHistory(false));
      historyClear.addEventListener('click', clearHistory);
      historyList.addEventListener('click', e => {
        const item = e.target.closest('.history-item');
        if (!item) return;
        const entry = history[Number(item.dataset.index)];
        if (entry) {
          expression = String(entry.result);
          justEvaluated = false;
          committedResult = '';
          openHistory(false);
          update();
        }
      });
      document.addEventListener('keydown', handleKeyboard);
      // Keep buttons from holding focus after mouse click
      document.querySelectorAll('.key, .icon-btn').forEach(b =>
        b.addEventListener('click', () => b.blur()));

      // initial theme
      const savedTheme = store.get('calcpro.theme', null);
      applyTheme(savedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));

      degToggle.textContent = degreeMode ? 'DEG' : 'RAD';
      renderHistory();
      update();
    }

    init();
    /* ================= APP END ================= */
  </script>
</body>
</html>
